name: Release

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'control-center-preload.js'
      - 'renderer.js'
      - 'preload.js'
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload assets to'
        required: true
        default: 'v1.0.1-rc.1'
      checkout_ref:
        description: 'Git ref to build from'
        required: true
        default: 'v1.0.1-rc.1'

jobs:
  test-build:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            pack_command: npm run pack
          - platform: windows
            runner: windows-latest
            pack_command: npm run build:control-center && npx electron-builder --win --x64 --dir --publish never
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Pack unsigned app
        run: ${{ matrix.pack_command }}

  release-macos:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned macOS test distribution
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          overwrite_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-macos-${{ steps.release.outputs.tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release-windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Windows test distribution
        run: npm run dist -- --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Mark unsigned Windows test assets
        run: npm run prepare-windows-release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          overwrite_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-windows-${{ steps.release.outputs.tag }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
