name: Release

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/desktop/main.js'
      - 'apps/desktop/control-center-preload.js'
      - 'apps/desktop/renderer.js'
      - 'apps/desktop/preload.js'
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'tests/**'
      - 'build/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload assets to'
        required: true
        default: 'v1.0.1-rc.1'
      checkout_ref:
        description: 'Git ref to build from'
        required: true
        default: 'v1.0.1-rc.1'

jobs:
  test-build:
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            pack_command: npm run pack
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build:contracts

      - name: Install Playwright Chromium
        if: matrix.platform == 'macos'
        run: npx playwright install chromium

      - name: Test
        if: matrix.platform == 'macos'
        run: npm test

      - name: Check syntax
        if: matrix.platform == 'macos'
        run: npm run check:syntax

      - name: Validate Windows release build inputs
        if: matrix.platform == 'windows'
        run: node -e "const pkg = require('./package.json'); if (!pkg.name || !pkg.version) throw new Error('package metadata incomplete'); console.log(pkg.name + '@' + pkg.version)"

      - name: Build Control Center on Windows
        if: matrix.platform == 'windows'
        run: npm run build:control-center

      - name: Pack macOS app
        if: matrix.platform == 'macos'
        run: ${{ matrix.pack_command }}

      - name: Build and verify self-signed Windows artifacts
        if: matrix.platform == 'windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          DEBUG: electron-builder
          SIGNTOOL_TIMEOUT: 120000
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-ci-test.pfx'
          $certPemPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-ci-test.pem'
          $keyPemPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-ci-test-key.pem'
          $cerPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-ci-test.cer'
          $password = [Guid]::NewGuid().ToString('N')
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          try {
            Write-Output "Generating temporary self-signed code-signing certificate with $openssl."
            & $openssl req -x509 -newkey rsa:2048 -nodes -keyout $keyPemPath -out $certPemPath -days 3 -subj '/CN=OpenPet Self-Signed CI Test' -addext 'basicConstraints=critical,CA:FALSE' -addext 'keyUsage=critical,digitalSignature' -addext 'extendedKeyUsage=codeSigning'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $openssl pkcs12 -export -out $pfxPath -inkey $keyPemPath -in $certPemPath -passout "pass:$password"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $openssl x509 -in $certPemPath -outform DER -out $cerPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output 'Exported temporary signing certificate.'
            $env:CSC_LINK = $pfxPath
            $env:CSC_KEY_PASSWORD = $password
            $env:ELECTRON_BUILDER_OFFLINE = 'true'
            Write-Output 'Starting Windows package build with electron-builder diagnostics.'
            npm run dist -- --win --x64 --publish never
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output 'Windows package build completed; preparing release assets.'
            npm run prepare-windows-release-assets -- --self-signed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $installer = Get-ChildItem release -Filter '*self-signed.exe' | Select-Object -First 1
            if (-not $installer) { throw 'No self-signed Windows installer was produced' }
            Write-Output 'Importing temporary certificate for Authenticode verification.'
            Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Windows Authenticode status is $($signature.Status), expected Valid. $($signature.StatusMessage)" }
            Write-Output "Verified self-signed installer with temporary CI trust: $($installer.Name); Authenticode=$($signature.Status)"
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certPemPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $keyPemPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $cerPath -Force -ErrorAction SilentlyContinue
          }

  release-macos:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build:contracts

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build self-managed macOS distribution
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create macOS release evidence
        shell: bash
        run: |
          app_path="$(find release -maxdepth 3 -name 'OpenPet.app' -type d | head -n 1)"
          if [ -n "$app_path" ]; then
            npm run create-macos-release-evidence -- --app "$app_path" --notarization-text $'status: NotApplicable\nsource: self-managed signing policy; notarization is intentionally not used\n' --output-dir release/macos-release-evidence
          else
            echo "::warning::OpenPet.app was not found under release/. Writing pending self-managed macOS release evidence."
            npm run create-macos-release-evidence -- --skip-codesign --skip-spctl --notarization-text $'status: NotApplicable\nsource: self-managed signing policy; notarization is intentionally not used\n' --output-dir release/macos-release-evidence
          fi

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-macos-release-evidence-${{ steps.release.outputs.tag }}
          path: release/macos-release-evidence/**
          if-no-files-found: error

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          overwrite_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-macos-${{ steps.release.outputs.tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release-windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows release metadata
        run: node -e "const pkg = require('./package.json'); if (!pkg.name || !pkg.version) throw new Error('package metadata incomplete'); console.log(pkg.name + '@' + pkg.version)"

      - name: Build Control Center
        run: npm run build:control-center

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ -(alpha|beta|rc)(\.|-|$) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build self-managed Windows distribution
        timeout-minutes: 45
        shell: pwsh
        env:
          DEBUG: electron-builder
          SIGNTOOL_TIMEOUT: 120000
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-release.pfx'
          $certPemPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-release.pem'
          $keyPemPath = Join-Path $env:RUNNER_TEMP 'openpet-self-signed-release-key.pem'
          $password = [Guid]::NewGuid().ToString('N')
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          try {
            Write-Output "Generating temporary self-signed code-signing certificate with $openssl."
            & $openssl req -x509 -newkey rsa:2048 -nodes -keyout $keyPemPath -out $certPemPath -days 3 -subj '/CN=OpenPet Self-Signed Release' -addext 'basicConstraints=critical,CA:FALSE' -addext 'keyUsage=critical,digitalSignature' -addext 'extendedKeyUsage=codeSigning'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $openssl pkcs12 -export -out $pfxPath -inkey $keyPemPath -in $certPemPath -passout "pass:$password"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output 'Exported temporary signing certificate.'
            $env:CSC_LINK = $pfxPath
            $env:CSC_KEY_PASSWORD = $password
            $env:ELECTRON_BUILDER_OFFLINE = 'true'
            Write-Output 'Starting Windows package build with electron-builder diagnostics.'
            npm run dist -- --win --x64 --publish never
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output 'Windows package build completed.'
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certPemPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $keyPemPath -Force -ErrorAction SilentlyContinue
          }
      - name: Mark self-signed Windows assets
        run: npm run prepare-windows-release-assets -- --self-signed

      - name: Create pending Windows smoke report
        run: npm run create-windows-smoke-report -- --output release/windows-smoke-report.json

      - name: Validate pending Windows smoke report
        run: npm run validate-windows-smoke-report -- release/windows-smoke-report.json --allow-pending

      - name: Create Windows smoke validation runbook
        run: npm run create-windows-smoke-runbook -- release/windows-smoke-report.json --output release/windows-smoke-runbook.md

      - name: Create Windows smoke evidence collector
        run: npm run create-windows-smoke-collector -- release/windows-smoke-report.json --output release/windows-smoke-collector.ps1

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          overwrite_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-windows-${{ steps.release.outputs.tag }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload Windows smoke report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openpet-windows-smoke-evidence-${{ steps.release.outputs.tag }}
          path: |
            release/windows-smoke-report.json
            release/windows-smoke-runbook.md
            release/windows-smoke-collector.ps1
          if-no-files-found: error
