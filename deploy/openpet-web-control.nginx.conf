# Replace OPENPET_DOMAIN and MESH_IP during installation.
# This server must be bound to the EasyTier address only; do not bind 0.0.0.0.
server {
    listen MESH_IP:80 default_server;
    server_name _;
    return 444;
}

server {
    listen MESH_IP:80;
    server_name OPENPET_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen MESH_IP:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/openpet/tls/fullchain.pem;
    ssl_certificate_key /etc/openpet/tls/privkey.pem;
    return 444;
}

server {
    listen MESH_IP:443 ssl http2;
    server_name OPENPET_DOMAIN;

    ssl_certificate     /etc/openpet/tls/fullchain.pem;
    ssl_certificate_key /etc/openpet/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The desktop-session control endpoints are intentionally reachable only
    # through the trusted local SSH transport, never through the mesh website.
    location = /__openpet/web/login {
        proxy_pass http://127.0.0.1:48330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 16k;
    }

    location = /__openpet/web/logout {
        proxy_pass http://127.0.0.1:48330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }

    location ^~ /__openpet/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:48330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 2m;
    }
}
